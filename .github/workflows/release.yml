name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      SIGN_P12: ${{ secrets.DEVELOPER_ID_P12 }}
      SIGN_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
      NOTARY_KEY: ${{ secrets.NOTARY_API_KEY_P8 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
      NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Dependency Rule
        run: ./scripts/check-dependency-rule.sh

      - name: Format lint
        run: swift format lint --strict --recursive Sources Tests Package.swift

      - name: Test
        run: swift test

      - name: Check localizations
        run: ./scripts/localizations.sh check

      # A release is signed and notarized or it does not ship: a missing
      # secret fails the job rather than shipping an ad-hoc build.
      - name: Keep crash reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: crash-reports
          path: ~/Library/Logs/DiagnosticReports/
          if-no-files-found: ignore

      - name: Check release locations
        run: python3 scripts/check-release-config.py

      - name: Import signing identity
        run: ./scripts/ci-import-signing-identity.sh

      - name: Build app bundle
        run: ./scripts/build-app.sh "${GITHUB_REF_NAME#v}" universal

      - name: Smoke test the packaged app
        run: |
          codesign --verify --strict --verbose=2 dist/WhiskyMac.app
          ./dist/WhiskyMac.app/Contents/MacOS/Whisk --smoke-test | grep -q "smoke test passed"

      - name: Notarize and staple the app
        run: |
          set -euo pipefail
          test -n "$NOTARY_KEY" || { echo "NOTARY_API_KEY_P8 secret missing" >&2; exit 1; }
          echo "$NOTARY_KEY" | base64 --decode > notary.p8
          ditto -c -k --keepParent dist/WhiskyMac.app notarize-app.zip
          xcrun notarytool submit notarize-app.zip \
            --key notary.p8 --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple dist/WhiskyMac.app
          spctl -a -vv -t exec dist/WhiskyMac.app
          rm notarize-app.zip

      - name: Archive corresponding source
        run: git archive --format=tar.gz --prefix=WhiskyMac/ -o dist/WhiskyMac-source.tar.gz "$GITHUB_SHA"

      - name: Zip app
        run: ditto -c -k --keepParent dist/WhiskyMac.app "dist/WhiskyMac-${GITHUB_REF_NAME}.zip"

      - name: Build DMG
        run: ./scripts/make-dmg.sh

      - name: Notarize and staple the DMG
        run: |
          set -euo pipefail
          xcrun notarytool submit dist/WhiskyMac.dmg \
            --key notary.p8 --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" \
            --wait
          xcrun stapler staple dist/WhiskyMac.dmg
          rm notary.p8

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # The notes are the version's CHANGELOG section; a version without
        # one falls back to GitHub's generated notes.
        run: |
          if ./scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md; then
            notes=(--notes-file release-notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/WhiskyMac-${GITHUB_REF_NAME}.zip" \
            "dist/WhiskyMac.dmg" \
            "dist/WhiskyMac-source.tar.gz" \
            --title "$GITHUB_REF_NAME" \
            "${notes[@]}"
